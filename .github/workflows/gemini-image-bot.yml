name: Gemini Multi-File Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  chat:
    if: github.event.sender.type != 'Bot' && contains(github.event.issue.title, '[TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install @octokit/action @google/genai

      - name: Run Gemini Multi-File Bot
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { GoogleGenAI } = require('@google/genai');
            
            if (!process.env.GEMINI_API_KEY) {
              throw new Error("Грешка: Не е намерен GEMINI_API_KEY в GitHub Secrets!");
            }
            
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            // Събираме само предишната история като текстов контекст (без стари снимки/файлове), 
            // за да знае ботът за какво си говорим, но да не се претоварва.
            const contents = [];
            
            contents.push({ 
              role: "user", 
              parts: [{ text: `Контекст: заглавието на чата е "${issue.data.title}". Първо съобщение: ${issue.data.body || "Здравей"}` }] 
            });

            // Добавяме предишните коментари само като текст
            for (const comment of comments.data) {
              // Прескачаме последното (текущо) съобщение, защото ще го обработим отделно с файловете му
              if (comment.id === context.payload.comment?.id) continue;
              
              const role = comment.user.type === 'Bot' ? 'model' : 'user';
              contents.push({ role: role, parts: [{ text: comment.body || "" }] });
            }

            // Сега взимаме НАЙ-НОВОТО съобщение (това, което току-що е задействало екшъна)
            const latestBody = context.payload.comment ? context.payload.comment.body : (issue.data.body || "");
            const latestParts = [{ text: latestBody }];

            // Търсим ВСИЧКИ линкове към файлове/снимки в това последно съобщение
            // Поддържаме както картинки, така и документи (.pdf, .txt и др., ако GitHub ги е качил)
            const fileUrls = latestBody.match(/https:\/\/(?:github\.com\/user-attachments\/assets\/|[a-zA-Z0-9-]+\.githubusercontent\.com\/[^\s)]+)/g);

            if (fileUrls) {
              console.log(`Открити файлове/снимки в текущото съобщение: ${fileUrls.length}`);
              for (const fileUrl of fileUrls) {
                try {
                  const fileResponse = await fetch(fileUrl, {
                    headers: {
                      'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                    }
                  });
                  
                  if (!fileResponse.ok) throw new Error(`HTTP error! status: ${fileResponse.status}`);
                  
                  const fileBuffer = await fileResponse.arrayBuffer();
                  const base64Data = Buffer.from(fileBuffer).toString('base64');
                  
                  // Определяме типа на файла по разширението в линка или го приемаме универсално
                  let mimeType = "image/jpeg"; // по подразбиране
                  if (fileUrl.endsWith('.png')) mimeType = "image/png";
                  else if (fileUrl.endsWith('.webp')) mimeType = "image/webp";
                  else if (fileUrl.endsWith('.pdf')) mimeType = "application/pdf";
                  else if (fileUrl.endsWith('.txt')) mimeType = "text/plain";

                  latestParts.push({
                    inlineData: {
                      data: base64Data,
                      mimeType: mimeType
                    }
                  });
                } catch (fileErr) {
                  console.error("Неуспешно изтегляне на файл:", fileErr);
                }
              }
            }

            // Добавяме най-новото съобщение с всички негови прикрепени файлове към опашката
            contents.push({ role: 'user', parts: latestParts });

            try {
              // Използваме актуалния модел
              const response = await ai.models.generateContent({
                model: 'gemini-3.5-flash-lite',
                contents: contents,
              });

              const botResponse = response.text;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: botResponse
              });
            } catch (error) {
              console.error("Грешка при комуникация с Gemini (Множество файлове):", error);
              throw error;
            }

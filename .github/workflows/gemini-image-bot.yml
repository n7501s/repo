name: Gemini Image Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  chat:
    if: github.event.sender.type != 'Bot' && contains(github.event.issue.title, '[TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install @octokit/action @google/genai

      - name: Run Gemini Image Bot
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { GoogleGenAI } = require('@google/genai');
            
            if (!process.env.GEMINI_API_KEY) {
              throw new Error("Грешка: Не е намерен GEMINI_API_KEY в GitHub Secrets!");
            }
            
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            const contents = [];

            // Добавяме първото съобщение като потребител
            contents.push({ 
              role: "user", 
              parts: [{ text: `Контекст: заглавието на чата е "${issue.data.title}". Първо съобщение: ${issue.data.body || "Здравей"}` }] 
            });

            // Обхождаме коментарите
            for (const comment of comments.data) {
              const role = comment.user.type === 'Bot' ? 'model' : 'user';
              const commentParts = [{ text: comment.body || "" }];

              // Търсим линкове към качени в GitHub картинки
              const imageUrls = comment.body.match(/https:\/\/(?:github\.com\/user-attachments\/assets\/|[a-zA-Z0-9-]+\.githubusercontent\.com\/[^\s)]+)/g);

              if (imageUrls && role === 'user') {
                for (const imgUrl of imageUrls) {
                  try {
                    // Изтегляме картинката, използвайки GitHub токена за достъп до Private репозиторито
                    const imgResponse = await fetch(imgUrl, {
                      headers: {
                        'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                      }
                    });
                    
                    if (!imgResponse.ok) throw new Error(`HTTP error! status: ${imgResponse.status}`);
                    
                    const imgBuffer = await imgResponse.arrayBuffer();
                    const base64Data = Buffer.from(imgBuffer).toString('base64');
                    
                    commentParts.push({
                      inlineData: {
                        data: base64Data,
                        mimeType: "image/jpeg"
                      }
                    });
                  } catch (imgErr) {
                    console.error("Неуспешно изтегляне на снимка през Private линк:", imgErr);
                  }
                }
              }

              contents.push({ role: role, parts: commentParts });
            }

            // ЗАДЪЛЖИТЕЛНА ПРОВЕРКА: Google изисква последното съобщение винаги да е от потребителя (user)
            if (contents.length > 0 && contents[contents.length - 1].role === 'model') {
              contents.push({ role: 'user', parts: [{ text: "Моля, отговори на последното ми съобщение." }] });
            }

            try {
              const response = await ai.models.generateContent({
                model: 'gemini-3.5-flash-lite',
                contents: contents,
              });

              const botResponse = response.text;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: botResponse
              });
            } catch (error) {
              console.error("Грешка при комуникация с Gemini (Снимки):", error);
              throw error;
            }

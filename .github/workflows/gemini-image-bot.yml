name: Gemini Multi-File Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  chat:
    if: github.event.sender.type != 'Bot' && contains(github.event.issue.title, '[TEST]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install @octokit/action @google/genai

      - name: Run Gemini Bot
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { GoogleGenAI } = require('@google/genai');
            
            if (!process.env.GEMINI_API_KEY) {
              throw new Error("Грешка: Не е намерен GEMINI_API_KEY!");
            }
            
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            const contents = [];
            contents.push({ 
              role: "user", 
              parts: [{ text: `Контекст: заглавието на чата е "${issue.data.title}". Първо съобщение: ${issue.data.body || "Здравей"}` }] 
            });

            for (const comment of comments.data) {
              if (comment.id === context.payload.comment?.id) continue;
              const role = comment.user.type === 'Bot' ? 'model' : 'user';
              contents.push({ role: role, parts: [{ text: comment.body || "" }] });
            }

            const latestBody = context.payload.comment ? context.payload.comment.body : (issue.data.body || "");
            const latestParts = [{ text: latestBody }];

            // ПОПРАВЕН РЕГУЛЯРЕН ИЗРАЗ: Увлича пълния линк заедно с уникалния UUID код накрая
            const fileUrls = latestBody.match(/https:\/\/github\.com\/user-attachments\/assets\/[a-zA-Z0-9-]+/g);

            let debugLog = "\n\n--- [ДЕБЪГ ЛОГ] ---\n";

            if (fileUrls) {
              debugLog += `Намерени пълни линкове: ${fileUrls.length}\n`;
              for (const fileUrl of fileUrls) {
                try {
                  debugLog += `Теглене на: ${fileUrl}\n`;
                  
                  // Използваме fetch с пълна автентикация (GitHub токен), за да няма 404
                  const fileResponse = await fetch(fileUrl, {
                    headers: {
                      'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                      'User-Agent': 'GitHub-Actions-Bot'
                    },
                    redirect: 'follow'
                  });
                  
                  if (!fileResponse.ok) throw new Error(`HTTP error! status: ${fileResponse.status}`);
                  
                  const arrayBuffer = await fileResponse.arrayBuffer();
                  const base64Data = Buffer.from(arrayBuffer).toString('base64');
                  
                  debugLog += `Успешно! Изтеглени байтове: ${arrayBuffer.byteLength}\n`;

                  let mimeType = "image/jpeg";
                  if (fileUrl.includes('.png')) mimeType = "image/png";
                  else if (fileUrl.includes('.webp')) mimeType = "image/webp";
                  else if (fileUrl.includes('.pdf')) mimeType = "application/pdf";

                  latestParts.push({
                    inlineData: {
                      data: base64Data,
                      mimeType: mimeType
                    }
                  });
                } catch (err) {
                  debugLog += `ГРЕШКА: ${err.message}\n`;
                }
              }
            } else {
              debugLog += "Няма намерени линкове от този тип в текста.\n";
            }

            contents.push({ role: 'user', parts: latestParts });

            try {
              const response = await ai.models.generateContent({
                model: 'gemini-3.5-flash-lite',
                contents: contents,
              });

              const botResponse = response.text + debugLog;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: botResponse
              });
            } catch (error) {
              console.error("Грешка:", error);
              throw error;
            }

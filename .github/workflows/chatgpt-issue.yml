name: ChatGPT Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  chat:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Обновено към Node 24, за да няма предупреждения

      - name: Install Dependencies
        run: npm install @octokit/action @google/generative-ai openai

      - name: Run ChatGPT Bot
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Уверете се, че името тук съвпада със записаното в Secrets
        with:
          script: |
            const { OpenAI } = require('openai');
            
            // Вземаме ключа от системната среда
            const apiKey = process.env.OPENAI_API_KEY;
            
            if (!apiKey) {
              throw new Error("Критична грешка: OPENAI_API_KEY не е намерен в GitHub Secrets!");
            }

            const openai = new OpenAI({ apiKey: apiKey });
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            const messages = [
              { role: "system", content: `Ти си полезен асистент. Водиш разговор в GitHub Issue със заглавие: "${issue.data.title}".` },
              { role: "user", content: issue.data.body || "Здравей" }
            ];

            for (const comment of comments.data) {
              const role = comment.user.type === 'Bot' ? 'assistant' : 'user';
              messages.push({ role: role, content: comment.body });
            }

            try {
              const completion = await openai.chat.completions.create({
                model: "gpt-4o-mini",
                messages: messages,
              });

              const botResponse = completion.choices.message.content;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: botResponse
              });
            } catch (error) {
              console.error("Грешка при комуникация с OpenAI:", error);
              throw error;
            }

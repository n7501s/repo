name: Gemini Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  chat:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install @octokit/action @google/generative-ai

      - name: Run Gemini Bot
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            // Коректен импорт за новата версия на библиотеката на Google
            const { GoogleGenAI } = require('@google/generative-ai');
            const ai = new GoogleGenAI(); // Инициализация без аргументи (автоматично търси GEMINI_API_KEY в env)
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            const contents = [
              { role: "user", parts: [{ text: `Контекст: заглавието на чата е "${issue.data.title}". Първо съобщение: ${issue.data.body || "Здравей"}` }] }
            ];

            for (const comment of comments.data) {
              const role = comment.user.type === 'Bot' ? 'model' : 'user';
              contents.push({ role: role, parts: [{ text: comment.body }] });
            }

            try {
              const response = await ai.models.generateContent({
                model: 'gemini-2.5-flash',
                contents: contents,
              });

              const botResponse = response.text;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: botResponse
              });
            } catch (error) {
              console.error("Грешка при комуникация с Gemini:", error);
              throw error;
            }

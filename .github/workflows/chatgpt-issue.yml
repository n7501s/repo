name: Gemini Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  chat:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Инсталираме официалния нов пакет на Google за GenAI
      - name: Install Dependencies
        run: npm install @octokit/action @google/genai

      - name: Run Gemini Bot
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            // Използваме модерния и правилен импорт за новия SDK
            const { GoogleGenAI } = require('@google/genai');
            
            if (!process.env.GEMINI_API_KEY) {
              throw new Error("Грешка: Не е намерен GEMINI_API_KEY в GitHub Secrets!");
            }
            
            // Инициализираме клиента, подавайки му ключа изрично
            const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
            
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });

            // Подготвяме хронологията на чата в съответствие с изискванията на Gemini
            const contents = [
              { role: "user", parts: [{ text: `Контекст на разговора: заглавието на това Issue е "${issue.data.title}". Първоначално запитване: ${issue.data.body || "Здравей"}` }] }
            ];

            for (const comment of comments.data) {
              const role = comment.user.type === 'Bot' ? 'model' : 'user';
              contents.push({ role: role, parts: [{ text: comment.body }] });
            }

            try {
              // Генерираме съдържание чрез най-бързия безплатен модел gemini-2.5-flash
              const response = await ai.models.generateContent({
                model: 'gemini-3.5-flash-lite',
                contents: contents,
              });

              const botResponse = response.text;

              // Изпращаме генерирания отговор обратно в коментарите на Issue-то
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: botResponse
              });
            } catch (error) {
              console.error("Грешка при комуникация с Gemini:", error);
              throw error;
            }

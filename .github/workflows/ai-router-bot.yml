name: AI Router Bot Dev

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-router:
    # ПРЕДПАЗВАНЕ ОТ ЗАЦИКЛЯНЕ: Не стартирай, ако авторът е GitHub Actions бот
    if: github.actor != 'github-actions[bot]' && github.actor != 'actions-user'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install beautifulsoup4
    
      - name: Run Main Router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python scripts/main_router.py

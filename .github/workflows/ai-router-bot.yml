name: AI Router Bot (Test 3)

on:
  issues:
    types: [opened]
  workflow_dispatch:  # <-- Добавяме възможност за ръчен старт с бутон

jobs:
  router-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests

      - name: Run AI Router Script
        env:
          GOOGLE_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # <-- Взимаме от правилната кутийка в Secrets
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # И тук за всеки случай
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/main_router.py
